name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Clean bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Bootstrap from a clean checkout
        env:
          KAGU_ERP_SKIP_SERVICES: "1"
        run: bash ./scripts/bootstrap.sh

      - name: Ensure bootstrap did not modify tracked files
        run: test -z "$(git status --porcelain --untracked-files=no)"

  backend:
    name: Backend build and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KaguERP.slnx --locked-mode

      - name: Build
        run: dotnet build KaguERP.slnx --configuration Release --no-restore

      - name: Run domain unit checks
        run: dotnet tests/Unit/bin/Release/net10.0/KaguERP.DomainUnitChecks.dll

      - name: Check architecture
        run: dotnet run --project tests/Architecture/KaguERP.ArchitectureChecks.csproj --configuration Release --no-build

      - name: Check formatting
        run: dotnet format KaguERP.slnx --no-restore --verify-no-changes --verbosity minimal

  database:
    name: PostgreSQL migration, RLS and restore integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGU_ERP_POSTGRES_DB: kagu_erp
      KAGU_ERP_POSTGRES_USER: kagu_erp_local_owner
      KAGU_ERP_MIGRATOR_USER: kagu_erp_migrator
      KAGU_ERP_APP_USER: kagu_erp_app
      KEYCLOAK_POSTGRES_DB: keycloak
      KEYCLOAK_POSTGRES_USER: keycloak_local_owner
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: kagu-local-admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Generate ephemeral local credentials
        shell: bash
        run: |
          write_masked_secret() {
            local name="$1"
            local value
            value="$(openssl rand -hex 24)"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          write_masked_secret KAGU_ERP_POSTGRES_PASSWORD
          write_masked_secret KAGU_ERP_MIGRATOR_PASSWORD
          write_masked_secret KAGU_ERP_APP_PASSWORD
          write_masked_secret KEYCLOAK_POSTGRES_PASSWORD
          write_masked_secret KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD
          write_masked_secret KAGU_KEYCLOAK_SMOKE_PASSWORD

      - name: Start isolated PostgreSQL
        run: docker compose up --detach --wait erp-db

      - name: Run migrations twice and RLS checks
        run: bash ./scripts/test-db.sh

      - name: Run isolated restore smoke
        run: bash ./scripts/test-restore.sh

      - name: Capture PostgreSQL diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 200 erp-db

      - name: Remove ephemeral database
        if: always()
        run: docker compose down --volumes

  web:
    name: Web lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web
        run: pnpm verify

      - name: Check peer dependencies
        run: pnpm peers check

  android:
    name: Android lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Ensure Android compile SDK 37.0
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_path="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify wrapper and run Android gates
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebugAndroidTest --no-daemon

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
